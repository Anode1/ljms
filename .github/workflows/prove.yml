# prove.yml -- compile, and check the code against its own specification.
#
# The behaviour tests need a database and which one is the adopter's decision,
# so they cannot run here. `ant prove` needs nothing: it parses
# doc/Queue_States.txt as the specification and checks six properties of the
# state graph, in about 25 ms. The README already called wiring this up trivial,
# which left the one check that catches a spec-versus-code divergence running
# only when somebody remembered to type it.
#
# A template's mistakes are copied into every project that adopts it, so a
# divergence here is multiplied rather than contained.
name: prove

on:
  push:
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: compile (JDK only, no dependencies)
        run: ant
      - name: prove the state machine against doc/Queue_States.txt
        run: ant prove
