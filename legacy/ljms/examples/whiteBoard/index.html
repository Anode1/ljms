<html>

<center><b><font color="#3333FF"><font size=+2>LJMS - Whiteboard example</font></font></b></center>

soon as you release the mouse.

ARCHIVE="whiteboard.jar"

<param name="name_3"    value="Buddy">
<param name="name_4"    value="Cookie">
<param name="name_5"    value="Frosty">
<param name="name_6"    value="Funky">
<param name="name_7"    value="Giggles">
<param name="name_8"    value="Java">
<param name="name_9"    value="Lucky">

<param NAME=palette  VALUE="images/palette.gif">

</applet>

</html>
